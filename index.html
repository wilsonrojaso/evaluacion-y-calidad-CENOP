<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVALUACION Y CALIDAD - CENOP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-cyan: #00ff88;
            --neon-purple: #b000ff;
            --neon-pink: #ff006e;
            --neon-blue: #00d9ff;
            --dark-bg: #0a0e27;
            --grid-color: #1a2a4a;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --warning-yellow: #ffeb3b;
            --warning-orange: #ff9800;
            --warning-red: #ff5252;
        }

        body {
            font-family: 'Courier New', monospace;
            background-color: var(--dark-bg);
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* Fondo con cuadrícula */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(0deg, transparent 24%, var(--grid-color) 25%, var(--grid-color) 26%, transparent 27%, transparent 74%, var(--grid-color) 75%, var(--grid-color) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, var(--grid-color) 25%, var(--grid-color) 26%, transparent 27%, transparent 74%, var(--grid-color) 75%, var(--grid-color) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 1;
            opacity: 0.3;
        }

        /* Olas neon animadas */
        body::after {
            content: '';
            position: fixed;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 120px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120"><path d="M0,50 Q300,10 600,50 T1200,50 L1200,120 L0,120 Z" fill="rgba(0,255,136,0.05)"/><path d="M0,60 Q300,20 600,60 T1200,60 L1200,120 L0,120 Z" fill="rgba(0,217,255,0.05)"/></svg>') repeat-x;
            animation: wave 15s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes wave {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px 80px 20px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
            border-bottom: 2px solid var(--neon-cyan);
            padding-bottom: 20px;
            position: relative;
        }

        header .titulo-izq {
            flex: 1;
        }

        header h1 {
            font-size: 2.2em;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            animation: glitch 3s infinite;
            margin-bottom: 5px;
        }

        @keyframes glitch {
            0%, 100% { text-shadow: 0 0 20px rgba(0, 255, 136, 0.5); }
            50% { text-shadow: 0 0 30px rgba(176, 0, 255, 0.5); }
        }

        header .creditos {
            text-align: right;
            font-size: 0.85em;
            color: var(--text-secondary);
        }

        header .creditos .empresa {
            color: var(--neon-cyan);
            font-weight: bold;
        }

        header .creditos .autor {
            color: var(--neon-pink);
            font-weight: bold;
        }

        /* Panel de Controles */
        .control-panel {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 25px;
            font-size: 0.95em;
            font-family: 'Courier New', monospace;
            color: var(--neon-cyan);
            background: transparent;
            border: 2px solid var(--neon-cyan);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            border-radius: 4px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--neon-cyan);
            transition: left 0.4s ease;
            z-index: -1;
        }

        .btn:hover {
            color: var(--dark-bg);
            box-shadow: 0 0 20px var(--neon-cyan), inset 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .btn:hover::before {
            left: 0;
        }

        .btn.secondary {
            border-color: var(--neon-purple);
            color: var(--neon-purple);
        }

        .btn.secondary::before {
            background: var(--neon-purple);
        }

        .btn.secondary:hover {
            color: var(--dark-bg);
            box-shadow: 0 0 20px var(--neon-purple), inset 0 0 10px rgba(176, 0, 255, 0.3);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(5px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(10, 14, 39, 0.95) 0%, rgba(26, 42, 74, 0.95) 100%);
            border: 2px solid var(--neon-cyan);
            border-radius: 10px;
            padding: 35px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.2);
            position: relative;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-content h2 {
            color: var(--neon-cyan);
            margin-bottom: 20px;
            font-size: 1.6em;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--neon-blue);
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid var(--neon-cyan);
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
            border-radius: 4px;
            transition: all 0.3s ease;
            font-size: 0.95em;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--neon-purple);
            box-shadow: 0 0 15px rgba(176, 0, 255, 0.3);
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .modal-buttons .btn {
            flex: 1;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.8em;
            cursor: pointer;
            color: var(--neon-pink);
        }

        /* Grid de Cursos */
        .cursos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .curso-card {
            background: linear-gradient(135deg, rgba(10, 14, 39, 0.75) 0%, rgba(26, 42, 74, 0.75) 100%);
            border: 2px solid var(--neon-cyan);
            border-radius: 8px;
            padding: 22px;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.1);
        }

        .curso-card:hover {
            transform: translateY(-4px);
        }

        /* Clases de Alerta */
        .curso-card.warning-yellow {
            border-color: var(--warning-yellow) !important;
            box-shadow: 0 0 25px rgba(255, 235, 59, 0.35) !important;
        }

        .curso-card.warning-orange {
            border-color: var(--warning-orange) !important;
            box-shadow: 0 0 25px rgba(255, 152, 0, 0.35) !important;
        }

        .curso-card.warning-red {
            border-color: var(--warning-red) !important;
            box-shadow: 0 0 25px rgba(255, 82, 82, 0.45) !important;
        }

        .curso-header {
            margin-bottom: 15px;
            border-bottom: 1px solid var(--neon-cyan);
            padding-bottom: 12px;
        }

        .curso-titulo {
            font-size: 1.3em;
            color: var(--neon-cyan);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .curso-status {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(0, 255, 136, 0.15);
            border: 1px solid var(--neon-cyan);
            border-radius: 15px;
            font-size: 0.75em;
            color: var(--neon-cyan);
            text-transform: uppercase;
            font-weight: bold;
        }

        .curso-status.yellow {
            background: rgba(255, 235, 59, 0.2);
            border-color: var(--warning-yellow);
            color: var(--warning-yellow);
        }

        .curso-status.orange {
            background: rgba(255, 152, 0, 0.2);
            border-color: var(--warning-orange);
            color: var(--warning-orange);
        }

        .curso-status.red {
            background: rgba(255, 82, 82, 0.2);
            border-color: var(--warning-red);
            color: var(--warning-red);
        }

        .curso-status.ended {
            background: rgba(160, 160, 160, 0.15);
            border-color: #666;
            color: #888;
        }

        .info-row {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            font-size: 0.9em;
        }

        .info-label {
            color: var(--neon-blue);
            font-size: 0.85em;
            text-transform: uppercase;
            width: 100px;
            font-weight: bold;
        }

        .info-value {
            color: var(--text-primary);
            font-weight: bold;
        }

        .coordinador-info {
            background: rgba(0, 255, 136, 0.05);
            border-left: 3px solid var(--neon-cyan);
            padding: 12px;
            border-radius: 4px;
            margin: 15px 0;
        }

        .coordinador-nombre {
            color: var(--neon-pink);
            font-weight: bold;
            margin-bottom: 4px;
        }

        .phone-buttons {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .phone-btn {
            flex: 1;
            padding: 7px 4px;
            font-size: 0.72em;
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
            text-align: center;
        }

        .phone-btn:hover {
            box-shadow: 0 0 10px var(--neon-blue);
            background: rgba(0, 217, 255, 0.15);
        }

        .phone-btn.whatsapp {
            border-color: #25d366;
            color: #25d366;
        }

        .phone-btn.whatsapp:hover {
            box-shadow: 0 0 10px #25d366;
            background: rgba(37, 211, 102, 0.15);
        }

        .curso-acciones {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 9px;
            font-size: 0.8em;
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }

        .btn-action:hover {
            box-shadow: 0 0 15px var(--neon-cyan);
            background: rgba(0, 255, 136, 0.15);
        }

        .btn-action.danger {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }

        .btn-action.danger:hover {
            box-shadow: 0 0 15px var(--neon-pink);
            background: rgba(255, 0, 110, 0.15);
        }

        /* Sección de Exportación */
        .export-section {
            background: linear-gradient(135deg, rgba(10, 14, 39, 0.7) 0%, rgba(26, 42, 74, 0.7) 100%);
            border: 2px solid var(--neon-purple);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-top: 30px;
        }

        .export-section h3 {
            color: var(--neon-purple);
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .export-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Footer Abajo a la Derecha */
        .footer-creditos {
            text-align: right;
            padding-top: 35px;
            font-size: 0.9em;
            color: var(--text-secondary);
        }

        .footer-creditos span {
            color: var(--neon-pink);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            border: 1px dashed var(--grid-color);
            border-radius: 8px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: var(--neon-cyan);
            color: var(--dark-bg);
            padding: 12px 25px;
            border-radius: 4px;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .toast.error {
            background: var(--neon-pink);
            color: #ffffff;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
            }
            header .creditos {
                text-align: left;
            }
            .cursos-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="titulo-izq">
                <h1>EVALUACION Y CALIDAD - CENOP</h1>
            </div>
            <div class="creditos">
                <p class="empresa">CENOP</p>
                <p>Elaborado por: <span class="autor">IT WILSON ROJAS</span></p>
            </div>
        </header>

        <div class="control-panel">
            <button class="btn" onclick="abrirModal()">+ Nuevo Curso</button>
            <button class="btn secondary" onclick="exportarJSON()">📥 Exportar Reporte JSON</button>
            <button class="btn secondary" onclick="importarJSON()">📤 Cargar Reporte JSON</button>
        </div>

        <div id="cursosContainer" class="cursos-grid"></div>

        <div class="export-section">
            <h3>⚡ Centro de Control ⚡</h3>
            <div class="export-buttons">
                <button class="btn" onclick="limpiarTodos()">🗑️ Limpiar Todo</button>
                <button class="btn secondary" onclick="actualizarVista()">🔄 Actualizar</button>
            </div>
        </div>

        <!-- Crédito abajo a la derecha -->
        <div class="footer-creditos">
            elaborado por: <span>IT WILSON ROJAS - CENOP</span>
        </div>
    </div>

    <!-- Modal Formulario -->
    <div id="cursoModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="cerrarModal()">&times;</span>
            <h2 id="modalTitulo">Nuevo Curso</h2>
            <form id="cursoForm" onsubmit="guardarCurso(event)">
                <div class="form-group">
                    <label for="nombre">Nombre del Curso / Entrenamiento</label>
                    <input type="text" id="nombre" required placeholder="Ej: Operaciones Tácticas">
                </div>

                <div class="form-group">
                    <label for="fechaInicio">Fecha de Inicio</label>
                    <input type="date" id="fechaInicio" required>
                </div>

                <div class="form-group">
                    <label for="fechaFin">Fecha de Finalización</label>
                    <input type="date" id="fechaFin" required>
                </div>

                <div class="form-group">
                    <label for="grado">Grado del Coordinador</label>
                    <input type="text" id="grado" placeholder="Ej: Mayor, Capitán, Ingeniero">
                </div>

                <div class="form-group">
                    <label for="apellidos">Apellidos del Coordinador</label>
                    <input type="text" id="apellidos" required placeholder="Ej: García López">
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono del Coordinador</label>
                    <input type="tel" id="telefono" required placeholder="Ej: +57 310 1234567">
                </div>

                <div class="modal-buttons">
                    <button type="submit" class="btn">Guardar</button>
                    <button type="button" class="btn secondary" onclick="cerrarModal()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <input type="file" id="importFile" accept=".json" style="display: none;" onchange="procesarImportacion(event)">

    <script>
        let cursos = [];
        let cursoEditando = null;

        document.addEventListener('DOMContentLoaded', () => {
            cargarDatos();
            actualizarVista();
        });

        // Convierte el string YYYY-MM-DD en fecha Local pura a las 00:00:00 (Sin desfases UTC)
        function parsearFechaLocal(strFecha) {
            if (!strFecha) return null;
            const partes = strFecha.split('-');
            return new Date(parseInt(partes[0]), parseInt(partes[1]) - 1, parseInt(partes[2]), 0, 0, 0);
        }

        // Formatea directamente el string YYYY-MM-DD a DD/MM/YYYY sin alterar el día
        function formatearFechaVisual(strFecha) {
            if (!strFecha) return '';
            const [year, month, day] = strFecha.split('-');
            return `${day}/${month}/${year}`;
        }

        function abrirModal(id = null) {
            cursoEditando = id;
            const modal = document.getElementById('cursoModal');
            const form = document.getElementById('cursoForm');

            if (id !== null) {
                const curso = cursos.find(c => c.id === id);
                document.getElementById('modalTitulo').textContent = 'Editar Curso';
                document.getElementById('nombre').value = curso.nombre;
                document.getElementById('fechaInicio').value = curso.fechaInicio;
                document.getElementById('fechaFin').value = curso.fechaFin;
                document.getElementById('grado').value = curso.grado || '';
                document.getElementById('apellidos').value = curso.apellidos;
                document.getElementById('telefono').value = curso.telefono;
            } else {
                document.getElementById('modalTitulo').textContent = 'Nuevo Curso';
                form.reset();
            }

            modal.classList.add('active');
        }

        function cerrarModal() {
            document.getElementById('cursoModal').classList.remove('active');
            cursoEditando = null;
        }

        function guardarCurso(e) {
            e.preventDefault();

            const nombre = document.getElementById('nombre').value;
            const fechaInicio = document.getElementById('fechaInicio').value;
            const fechaFin = document.getElementById('fechaFin').value;
            const grado = document.getElementById('grado').value;
            const apellidos = document.getElementById('apellidos').value;
            const telefono = document.getElementById('telefono').value;

            const fInicio = parsearFechaLocal(fechaInicio);
            const fFin = parsearFechaLocal(fechaFin);

            if (fInicio > fFin) {
                mostrarToast('La fecha de inicio no puede ser posterior a la final', 'error');
                return;
            }

            if (cursoEditando !== null) {
                const curso = cursos.find(c => c.id === cursoEditando);
                curso.nombre = nombre;
                curso.fechaInicio = fechaInicio;
                curso.fechaFin = fechaFin;
                curso.grado = grado;
                curso.apellidos = apellidos;
                curso.telefono = telefono;
                mostrarToast('Curso actualizado correctamente');
            } else {
                cursos.push({
                    id: Date.now(),
                    nombre,
                    fechaInicio,
                    fechaFin,
                    grado,
                    apellidos,
                    telefono
                });
                mostrarToast('Curso agregado correctamente');
            }

            guardarDatos();
            cerrarModal();
            actualizarVista();
        }

        function eliminarCurso(id) {
            if (confirm('¿Estás seguro de eliminar este entrenamiento?')) {
                cursos = cursos.filter(c => c.id !== id);
                guardarDatos();
                actualizarVista();
                mostrarToast('Curso eliminado correctamente');
            }
        }

        // Semáforo: 5 días antes (Amarillo), 3 días antes (Naranja), 1 día / hoy (Rojo)
        function calcularAlerta(fechaFinStr) {
            const hoy = new Date();
            const hoyCero = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate(), 0, 0, 0);
            const finCero = parsearFechaLocal(fechaFinStr);

            // Redondeo para evitar decimales por cambios de horario
            const msPorDia = 1000 * 60 * 60 * 24;
            const diferencia = Math.round((finCero - hoyCero) / msPorDia);

            if (diferencia < 0) {
                return { nivel: 'terminado', dias: Math.abs(diferencia), clase: '', colorStatus: 'ended' };
            }
            if (diferencia === 0) {
                return { nivel: 'hoy', dias: 0, clase: 'warning-red', colorStatus: 'red' };
            }
            if (diferencia === 1) {
                return { nivel: 'urgente', dias: 1, clase: 'warning-red', colorStatus: 'red' };
            }
            if (diferencia <= 3) {
                return { nivel: 'critico', dias: diferencia, clase: 'warning-orange', colorStatus: 'orange' };
            }
            if (diferencia <= 5) {
                return { nivel: 'advertencia', dias: diferencia, clase: 'warning-yellow', colorStatus: 'yellow' };
            }
            return { nivel: 'normal', dias: diferencia, clase: '', colorStatus: '' };
        }

        function obtenerEtiqueta(alerta) {
            switch (alerta.nivel) {
                case 'terminado': return `FINALIZADO HACE ${alerta.dias} DÍA${alerta.dias !== 1 ? 'S' : ''}`;
                case 'hoy': return '⚠️ FINALIZA HOY';
                case 'urgente': return '⚠️ VENCE MAÑANA (1 DÍA)';
                case 'critico': return `⚠️ VENCE EN ${alerta.dias} DÍAS`;
                case 'advertencia': return `⚠️ AVISO: VENCE EN ${alerta.dias} DÍAS`;
                case 'normal': return `EN CURSO (${alerta.dias} DÍAS RESTANTES)`;
                default: return 'ACTIVO';
            }
        }

        function actualizarVista() {
            const container = document.getElementById('cursosContainer');

            if (cursos.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1;">
                        <div class="empty-state">
                            <p>📡 No hay cursos o entrenamientos registrados.</p>
                            <p style="font-size: 0.85em; margin-top: 5px;">Presiona "+ Nuevo Curso" para agregar uno.</p>
                        </div>
                    </div>
                `;
                return;
            }

            container.innerHTML = cursos.map(curso => {
                const alerta = calcularAlerta(curso.fechaFin);
                const inicioVisual = formatearFechaVisual(curso.fechaInicio);
                const finVisual = formatearFechaVisual(curso.fechaFin);

                return `
                    <div class="curso-card ${alerta.clase}">
                        <div class="curso-header">
                            <div class="curso-titulo">${curso.nombre}</div>
                            <span class="curso-status ${alerta.colorStatus}">
                                ${obtenerEtiqueta(alerta)}
                            </span>
                        </div>

                        <div class="curso-info">
                            <div class="info-row">
                                <span class="info-label">📅 INICIO:</span>
                                <span class="info-value">${inicioVisual}</span>
                            </div>

                            <div class="info-row">
                                <span class="info-label">📅 FIN:</span>
                                <span class="info-value">${finVisual}</span>
                            </div>

                            <div class="coordinador-info">
                                <div class="coordinador-nombre">
                                    ${curso.grado ? curso.grado + ' ' : ''}${curso.apellidos}
                                </div>
                                <div style="font-size: 0.8em; color: var(--text-secondary); margin-bottom: 6px;">
                                    📞 ${curso.telefono}
                                </div>
                                <div class="phone-buttons">
                                    <button class="phone-btn" onclick="llamar('${curso.telefono}')">☎️ Llamar</button>
                                    <button class="phone-btn whatsapp" onclick="whatsapp('${curso.telefono}')">💬 WhatsApp</button>
                                    <button class="phone-btn" onclick="copiarNumero('${curso.telefono}')">📋 Copiar</button>
                                </div>
                            </div>
                        </div>

                        <div class="curso-acciones">
                            <button class="btn-action" onclick="abrirModal(${curso.id})">✏️ Editar</button>
                            <button class="btn-action danger" onclick="eliminarCurso(${curso.id})">🗑️ Eliminar</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function llamar(telefono) {
            window.location.href = `tel:${telefono}`;
        }

        function whatsapp(telefono) {
            const numero = telefono.replace(/[^0-9]/g, '');
            window.open(`https://wa.me/${numero}`, '_blank');
        }

        function copiarNumero(telefono) {
            navigator.clipboard.writeText(telefono).then(() => {
                mostrarToast('Número copiado al portapapeles');
            });
        }

        function exportarJSON() {
            const datos = {
                empresa: "CENOP",
                dependencia: "EVALUACION Y CALIDAD",
                autor: "IT WILSON ROJAS",
                fechaExportacion: new Date().toISOString(),
                cursos: cursos
            };

            const json = JSON.stringify(datos, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `REPORTE_CENOP_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            mostrarToast('Reporte JSON generado');
        }

        function importarJSON() {
            document.getElementById('importFile').click();
        }

        function procesarImportacion(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const datos = JSON.parse(event.target.result);
                    const listado = Array.isArray(datos) ? datos : datos.cursos;

                    if (!Array.isArray(listado)) {
                        throw new Error('Estructura no válida');
                    }

                    if (confirm(`Se cargarán ${listado.length} registros. ¿Deseas reemplazar los datos actuales?`)) {
                        cursos = listado;
                        guardarDatos();
                        actualizarVista();
                        mostrarToast('Reporte cargado con éxito');
                    }
                } catch (error) {
                    mostrarToast('Error al importar archivo JSON', 'error');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        function limpiarTodos() {
            if (confirm('⚠️ ¿Estás seguro de eliminar TODOS los entrenamientos?')) {
                cursos = [];
                guardarDatos();
                actualizarVista();
                mostrarToast('Base de datos vaciada');
            }
        }

        function guardarDatos() {
            localStorage.setItem('cenop_cursos_db', JSON.stringify(cursos));
        }

        function cargarDatos() {
            const datos = localStorage.getItem('cenop_cursos_db');
            if (datos) {
                try {
                    cursos = JSON.parse(datos);
                } catch (e) {
                    cursos = [];
                }
            }
        }

        function mostrarToast(mensaje, tipo = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            toast.textContent = mensaje;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        window.onclick = (event) => {
            const modal = document.getElementById('cursoModal');
            if (event.target === modal) {
                cerrarModal();
            }
        };
    </script>
</body>
</html>
