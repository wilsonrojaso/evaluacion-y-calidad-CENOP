<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVALUACION Y CALIDAD - CENOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07060f; --panel:#0d0b1c; --line:#2a2250;
  --cyan:#05d9e8; --magenta:#ff2a6d; --yellow:#f9f002; --violet:#8a3ffc; --orange:#ff8a1f;
  --text:#d9e6ff; --dim:#7d78a8;
  --display:'Orbitron','Arial Black',sans-serif;
  --body:'Rajdhani','Segoe UI',sans-serif;
  --mono:'Share Tech Mono','Courier New',monospace;
}
html{scroll-behavior:smooth}
body{font-family:var(--body);font-size:1.1rem;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* Fondo: horizonte con rejilla en perspectiva + resplandor */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
   radial-gradient(ellipse 60% 40% at 80% 0%,rgba(255,42,109,.22),transparent 70%),
   radial-gradient(ellipse 60% 45% at 10% 10%,rgba(138,63,252,.25),transparent 70%),
   linear-gradient(#07060f,#0c0824 60%,#150a33)}
.bg .floor{position:absolute;left:-50%;bottom:-10%;width:200%;height:55%;
  background-image:
   linear-gradient(rgba(5,217,232,.5) 1px,transparent 1px),
   linear-gradient(90deg,rgba(5,217,232,.5) 1px,transparent 1px);
  background-size:60px 60px;transform:perspective(420px) rotateX(62deg);transform-origin:center top;
  animation:floor 3s linear infinite;
  -webkit-mask-image:linear-gradient(transparent 0%,#000 60%);mask-image:linear-gradient(transparent 0%,#000 60%);opacity:.55}
@keyframes floor{to{background-position:0 60px}}
.scan{position:fixed;inset:0;z-index:50;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0,rgba(0,0,0,.18) 1px,transparent 1px,transparent 3px);mix-blend-mode:multiply}

.wrap{position:relative;z-index:2;max-width:1240px;margin:0 auto;padding:28px 22px 60px}

/* Cabecera */
header{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding-bottom:22px;margin-bottom:28px;position:relative}
header::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--magenta),var(--violet),var(--cyan));box-shadow:0 0 18px var(--magenta)}
h1{font-family:var(--display);font-weight:900;font-size:clamp(1.7rem,4.6vw,3.3rem);line-height:1.05;letter-spacing:.04em;
  color:#fff;position:relative;display:inline-block;text-shadow:0 0 22px rgba(5,217,232,.55)}
h1::before,h1::after{content:attr(data-text);position:absolute;inset:0;overflow:hidden}
h1::before{color:var(--magenta);transform:translate(3px,0);clip-path:inset(0 0 60% 0);animation:glitchA 4.5s infinite steps(1)}
h1::after{color:var(--cyan);transform:translate(-3px,0);clip-path:inset(55% 0 0 0);animation:glitchB 4.5s infinite steps(1)}
@keyframes glitchA{0%,92%,100%{opacity:0}93%{opacity:.9;transform:translate(5px,-1px)}95%{opacity:.9;transform:translate(-4px,1px)}97%{opacity:0}}
@keyframes glitchB{0%,92%,100%{opacity:0}94%{opacity:.9;transform:translate(-5px,1px)}96%{opacity:.9;transform:translate(4px,-1px)}98%{opacity:0}}
.sub{font-family:var(--mono);color:var(--cyan);font-size:.95rem;margin-top:10px}
.sub .cur{display:inline-block;width:.6em;height:1em;background:var(--cyan);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hud{text-align:right;font-family:var(--mono);font-size:.9rem;color:var(--dim);line-height:1.6}
.hud b{color:var(--magenta);font-family:var(--display);font-weight:700;letter-spacing:.08em}
.hud .reloj{color:var(--yellow);font-size:1.5rem;letter-spacing:.1em;text-shadow:0 0 10px rgba(249,240,2,.6)}

/* Estadísticas */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.stat{--c:var(--cyan);background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);padding:14px 16px;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
.stat strong{display:block;font-family:var(--display);font-size:2rem;color:var(--c);text-shadow:0 0 14px var(--c);line-height:1.1}
.stat span{font-family:var(--mono);font-size:.82rem;color:var(--dim)}
.stat.m{--c:var(--magenta)}.stat.y{--c:var(--yellow)}.stat.v{--c:var(--violet)}

/* Barra de control */
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:28px}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:12px 14px 12px 40px;background:rgba(5,217,232,.05);border:1px solid var(--line);color:var(--text);
  font-family:var(--mono);font-size:1rem;clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
.search::before{content:'>_';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-family:var(--mono);color:var(--cyan)}
.btn{--c:var(--cyan);font-family:var(--display);font-weight:700;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;
  padding:13px 22px;color:var(--c);background:transparent;border:0;cursor:pointer;position:relative;
  background:linear-gradient(var(--c),var(--c)) bottom/100% 2px no-repeat,rgba(255,255,255,.02);
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  transition:background-color .2s,color .2s,filter .2s}
.btn:hover{color:var(--bg);background:var(--c);filter:drop-shadow(0 0 8px var(--c))}
.btn.m{--c:var(--magenta)}.btn.v{--c:var(--violet)}.btn.y{--c:var(--yellow)}
.btn.primary{color:var(--bg);background:var(--c)}
.btn.primary:hover{filter:brightness(1.15) drop-shadow(0 0 10px var(--c))}
:focus-visible{outline:2px dashed var(--yellow);outline-offset:3px}

/* Tarjetas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:24px}
.card{--c:var(--cyan);position:relative;padding:2px;background:linear-gradient(135deg,var(--c),transparent 55%,var(--c));
  clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,26px 100%,0 calc(100% - 26px));
  filter:drop-shadow(0 0 10px color-mix(in srgb,var(--c) 45%,transparent));transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.card[data-n="advertencia"]{--c:var(--yellow)}
.card[data-n="critico"]{--c:var(--orange)}
.card[data-n="urgente"],.card[data-n="hoy"]{--c:var(--magenta)}
.card[data-n="terminado"]{--c:#5a5680;filter:none}
.card[data-n="urgente"],.card[data-n="hoy"]{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 22px var(--magenta))}}
.inner{background:linear-gradient(160deg,#120e2b,#0a0818);padding:22px 22px 20px;height:100%;
  clip-path:polygon(0 0,calc(100% - 25px) 0,100% 25px,100% 100%,25px 100%,0 calc(100% - 25px))}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:14px}
.titulo{font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.05em;text-transform:uppercase;color:#fff;word-break:break-word;padding-right:20px}
.tag{display:inline-block;font-family:var(--mono);font-size:.78rem;padding:4px 10px;color:var(--c);border:1px solid var(--c);
  background:color-mix(in srgb,var(--c) 14%,transparent);margin-bottom:14px}
.fechas{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-family:var(--mono);font-size:.88rem;margin-bottom:12px}
.fechas small{display:block;color:var(--dim);font-size:.72rem}
.fechas span{color:var(--text)}
.prog{height:8px;background:#1a1536;position:relative;margin-bottom:6px;
  clip-path:polygon(0 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.prog i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--violet),var(--c));box-shadow:0 0 10px var(--c)}
.pct{font-family:var(--mono);font-size:.75rem;color:var(--dim);text-align:right;margin-bottom:14px}
.coord{border-left:3px solid var(--violet);background:rgba(138,63,252,.08);padding:10px 12px;margin-bottom:14px}
.coord small{font-family:var(--mono);color:var(--dim);font-size:.75rem}
.coord p{font-weight:700;font-size:1.2rem;color:var(--c)}
.tel{font-family:var(--mono);font-size:.85rem;color:var(--text)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mini{flex:1;min-width:76px;font-family:var(--mono);font-size:.78rem;padding:7px 8px;cursor:pointer;color:var(--cyan);
  background:transparent;border:1px solid var(--cyan);transition:.2s}
.mini:hover{background:rgba(5,217,232,.15);box-shadow:0 0 10px var(--cyan)}
.mini.wa{color:#3dff8b;border-color:#3dff8b}.mini.wa:hover{background:rgba(61,255,139,.15);box-shadow:0 0 10px #3dff8b}
.mini.ed{color:var(--yellow);border-color:var(--yellow)}.mini.ed:hover{background:rgba(249,240,2,.12);box-shadow:0 0 10px var(--yellow)}
.mini.del{color:var(--magenta);border-color:var(--magenta)}.mini.del:hover{background:rgba(255,42,109,.15);box-shadow:0 0 10px var(--magenta)}
.acciones{border-top:1px dashed var(--line);margin-top:14px;padding-top:2px}

.empty{grid-column:1/-1;text-align:center;padding:60px 20px;border:1px dashed var(--line);font-family:var(--mono);color:var(--dim)}
.empty h2{font-family:var(--display);color:var(--magenta);font-size:1.2rem;margin-bottom:8px;text-shadow:0 0 12px var(--magenta)}

.control{margin-top:40px;border:1px solid var(--violet);padding:20px;text-align:center;background:rgba(138,63,252,.06)}
.control h3{font-family:var(--display);color:var(--violet);margin-bottom:14px;letter-spacing:.15em;font-size:1rem;text-shadow:0 0 12px var(--violet)}
.control .row{justify-content:center}.control .btn{flex:0}

/* Modal */
.modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(5,4,14,.88);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:16px;overflow:auto}
.modal.on{display:flex}
.mbox{width:100%;max-width:520px;padding:2px;background:linear-gradient(135deg,var(--cyan),var(--violet),var(--magenta));
  clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,28px 100%,0 calc(100% - 28px));animation:open .25s ease}
@keyframes open{from{transform:scale(.94);opacity:0}}
.mbody{background:#0b0919;padding:30px 28px;clip-path:polygon(0 0,calc(100% - 27px) 0,100% 27px,100% 100%,27px 100%,0 calc(100% - 27px))}
.mbody h2{font-family:var(--display);color:var(--cyan);margin-bottom:20px;font-size:1.3rem;text-shadow:0 0 12px var(--cyan)}
.f{margin-bottom:14px}
.f label{display:block;font-family:var(--mono);font-size:.8rem;color:var(--magenta);margin-bottom:5px}
.f input{width:100%;padding:11px 12px;background:rgba(5,217,232,.05);border:1px solid var(--line);color:var(--text);font:1rem var(--mono);color-scheme:dark}
.f input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 14px rgba(5,217,232,.35)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.macts{display:flex;gap:12px;margin-top:22px}.macts .btn{flex:1}

/* Toast */
.toast{position:fixed;right:18px;bottom:18px;z-index:200;font-family:var(--mono);padding:14px 20px;color:var(--bg);background:var(--cyan);
  clip-path:polygon(10px 0,100% 0,100% 100%,0 100%,0 10px);box-shadow:0 0 20px var(--cyan);animation:in .3s ease;font-weight:700}
.toast.error{background:var(--magenta)}.toast.warning{background:var(--yellow)}
@keyframes in{from{transform:translateX(120%)}}

@media(max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}header{grid-template-columns:1fr}.hud{text-align:left}}
@media(max-width:480px){.grid{grid-template-columns:1fr}.f2{grid-template-columns:1fr}.btn{flex:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"><div class="floor"></div></div>
<div class="scan"></div>

<div class="wrap">
  <header>
    <div>
      <h1 data-text="EVALUACION Y CALIDAD">EVALUACION Y CALIDAD</h1>
      <p class="sub">// CENOP · control de cursos<span class="cur"></span></p>
    </div>
    <div class="hud">
      <div class="reloj" id="reloj">--:--:--</div>
      <div id="fechaHoy"></div>
      <div>Elaborado por <b>IT WILSON ROJAS</b></div>
    </div>
  </header>

  <section class="stats" aria-label="Resumen">
    <div class="stat"><strong id="sTotal">0</strong><span>Cursos registrados</span></div>
    <div class="stat v"><strong id="sCurso">0</strong><span>En curso</span></div>
    <div class="stat m"><strong id="sRiesgo">0</strong><span>Vencen en 5 días o menos</span></div>
    <div class="stat y"><strong id="sFin">0</strong><span>Terminados</span></div>
  </section>

  <div class="bar">
    <div class="search"><input id="buscar" type="search" placeholder="Buscar curso o coordinador" aria-label="Buscar"></div>
    <button class="btn primary" data-act="nuevo">+ Nuevo curso</button>
    <button class="btn v" data-act="exportar">Exportar</button>
    <button class="btn v" data-act="importar">Importar</button>
  </div>

  <div id="cursos" class="grid"></div>

  <div class="control">
    <h3>CENTRO DE CONTROL</h3>
    <div class="row">
      <button class="btn m" data-act="limpiar">Borrar todo</button>
      <button class="btn" data-act="refrescar">Actualizar</button>
    </div>
  </div>
</div>

<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitulo">
  <div class="mbox"><div class="mbody">
    <h2 id="mTitulo">Nuevo curso</h2>
    <form id="form">
      <div class="f"><label for="nombre">Nombre del curso</label><input id="nombre" required placeholder="Ej: JavaScript Avanzado"></div>
      <div class="f2">
        <div class="f"><label for="fechaInicio">Fecha de inicio</label><input type="date" id="fechaInicio" required></div>
        <div class="f"><label for="fechaFin">Fecha de finalización</label><input type="date" id="fechaFin" required></div>
      </div>
      <div class="f2">
        <div class="f"><label for="grado">Grado del coordinador</label><input id="grado" placeholder="Ej: Ingeniero"></div>
        <div class="f"><label for="apellidos">Apellidos</label><input id="apellidos" placeholder="Ej: García López"></div>
      </div>
      <div class="f"><label for="telefono">Teléfono del coordinador</label><input type="tel" id="telefono" placeholder="Ej: +57 300 123 4567"></div>
      <div class="macts">
        <button type="submit" class="btn primary">Guardar curso</button>
        <button type="button" class="btn m" data-act="cerrar">Cancelar</button>
      </div>
    </form>
  </div></div>
</div>

<input type="file" id="importFile" accept=".json" hidden>

<script>
let cursos = [];
let editando = null;
const $ = id => document.getElementById(id);
const DIA = 86400000;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Evita el desfase de un día que produce new Date('YYYY-MM-DD') (UTC)
const parseF = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const hoy0 = () => { const h = new Date(); h.setHours(0,0,0,0); return h; };

function alerta(fechaFin){
  const dias = Math.round((parseF(fechaFin) - hoy0()) / DIA);
  if (dias < 0)  return {n:'terminado', dias:0, txt:'TERMINADO'};
  if (dias === 0) return {n:'hoy', dias:0, txt:'⚠ VENCE HOY'};
  if (dias <= 1) return {n:'urgente', dias, txt:'⚠ VENCE EN 1 DÍA'};
  if (dias <= 3) return {n:'critico', dias, txt:`⚠ VENCE EN ${dias} DÍAS`};
  if (dias <= 5) return {n:'advertencia', dias, txt:`⚠ VENCE EN ${dias} DÍAS`};
  return {n:'normal', dias, txt:`EN CURSO · ${dias} DÍAS`};
}
function progreso(c){
  const a = parseF(c.fechaInicio), b = parseF(c.fechaFin);
  return Math.max(0, Math.min(100, Math.round((hoy0() - a) / (b - a) * 100)));
}
const fmt = s => parseF(s).toLocaleDateString('es-CO', {day:'2-digit', month:'short', year:'numeric'});

function render(){
  const q = $('buscar').value.trim().toLowerCase();
  const lista = cursos
    .filter(c => !q || `${c.nombre} ${c.grado} ${c.apellidos}`.toLowerCase().includes(q))
    .sort((a,b) => parseF(a.fechaFin) - parseF(b.fechaFin));

  let curso = 0, riesgo = 0, fin = 0;
  cursos.forEach(c => {
    const n = alerta(c.fechaFin).n;
    if (n === 'terminado') fin++; else { curso++; if (n !== 'normal') riesgo++; }
  });
  $('sTotal').textContent = cursos.length; $('sCurso').textContent = curso;
  $('sRiesgo').textContent = riesgo; $('sFin').textContent = fin;

  if (!lista.length){
    $('cursos').innerHTML = `<div class="empty"><h2>${cursos.length ? 'SIN COINCIDENCIAS' : 'SISTEMA SIN DATOS'}</h2>
      <p>${cursos.length ? 'Ningún curso coincide con la búsqueda.' : 'Pulsa «+ Nuevo curso» para registrar el primero.'}</p></div>`;
    return;
  }
  $('cursos').innerHTML = lista.map(c => {
    const a = alerta(c.fechaFin), p = progreso(c), t = esc(c.telefono);
    return `<article class="card" data-n="${a.n}"><div class="inner">
      <div class="top"><div class="titulo">${esc(c.nombre)}</div></div>
      <span class="tag">${a.txt}</span>
      <div class="fechas">
        <div><small>INICIO</small><span>${fmt(c.fechaInicio)}</span></div>
        <div><small>FIN</small><span>${fmt(c.fechaFin)}</span></div>
      </div>
      <div class="prog"><i style="width:${p}%"></i></div>
      <div class="pct">${p}% completado</div>
      <div class="coord">
        <small>COORDINADOR</small>
        <p>${esc(((c.grado ? c.grado + ' ' : '') + (c.apellidos || '')).trim()) || 'Sin asignar'}</p>
        <div class="tel">${t || 'Sin teléfono'}</div>
        ${t ? `<div class="row">
          <button class="mini" data-act="llamar" data-tel="${t}">Llamar</button>
          <button class="mini wa" data-act="wa" data-tel="${t}">WhatsApp</button>
          <button class="mini" data-act="copiar" data-tel="${t}">Copiar</button></div>` : ''}
      </div>
      <div class="row acciones">
        <button class="mini ed" data-act="editar" data-id="${c.id}">Editar</button>
        <button class="mini del" data-act="eliminar" data-id="${c.id}">Eliminar</button>
      </div>
    </div></article>`;
  }).join('');
}

/* Modal */
function abrir(id = null){
  editando = id;
  const f = $('form');
  if (id !== null){
    const c = cursos.find(x => x.id === id);
    $('mTitulo').textContent = 'Editar curso';
    ['nombre','fechaInicio','fechaFin','grado','apellidos','telefono'].forEach(k => $(k).value = c[k] ?? '');
  } else { $('mTitulo').textContent = 'Nuevo curso'; f.reset(); }
  $('modal').classList.add('on');
  $('nombre').focus();
}
function cerrar(){ $('modal').classList.remove('on'); editando = null; }

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const d = {};
  ['nombre','fechaInicio','fechaFin','grado','apellidos','telefono'].forEach(k => d[k] = $(k).value.trim());
  if (parseF(d.fechaInicio) >= parseF(d.fechaFin)) return toast('La fecha de inicio debe ser anterior a la fecha final', 'error');
  if (editando !== null){
    Object.assign(cursos.find(c => c.id === editando), d);
    toast('Curso actualizado');
  } else {
    cursos.push({id: Date.now(), ...d, fechaCreacion: new Date().toISOString()});
    toast('Curso agregado');
  }
  guardar(); cerrar(); render();
});

/* Acciones por delegación (evita inyectar datos en atributos onclick) */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b){
    const {act, id, tel} = b.dataset;
    if (act === 'nuevo') abrir();
    else if (act === 'cerrar') cerrar();
    else if (act === 'editar') abrir(Number(id));
    else if (act === 'eliminar'){
      if (confirm('¿Eliminar este curso?')){ cursos = cursos.filter(c => c.id !== Number(id)); guardar(); render(); toast('Curso eliminado', 'warning'); }
    }
    else if (act === 'llamar') location.href = `tel:${tel}`;
    else if (act === 'wa') window.open(`https://wa.me/${tel.replace(/\D/g, '')}`, '_blank', 'noopener');
    else if (act === 'copiar') navigator.clipboard.writeText(tel).then(() => toast('Número copiado'));
    else if (act === 'exportar') exportar();
    else if (act === 'importar') $('importFile').click();
    else if (act === 'refrescar'){ render(); toast('Vista actualizada'); }
    else if (act === 'limpiar'){
      if (confirm('Esto eliminará TODOS los cursos. ¿Continuar?') && confirm('No se puede deshacer. ¿Seguro?')){
        cursos = []; guardar(); render(); toast('Datos eliminados', 'warning');
      }
    }
    return;
  }
  if (e.target === $('modal')) cerrar();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrar(); });
$('buscar').addEventListener('input', render);

/* Exportar / importar */
function exportar(){
  const datos = {version:'1.0', fechaExportacion:new Date().toISOString(), totalCursos:cursos.length, empresa:'CENOP', cursos};
  const url = URL.createObjectURL(new Blob([JSON.stringify(datos, null, 2)], {type:'application/json'}));
  const a = document.createElement('a');
  a.href = url; a.download = `evaluacion-cenop-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast('Datos exportados');
}
$('importFile').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      if (!Array.isArray(d.cursos)) throw new Error('Formato de archivo inválido');
      if (confirm(`Se importarán ${d.cursos.length} cursos y se reemplazarán los actuales. ¿Continuar?`)){
        cursos = d.cursos; guardar(); render(); toast('Datos importados');
      }
    } catch (err){ toast('Error al importar: ' + err.message, 'error'); }
  };
  r.readAsText(file); e.target.value = '';
});

/* Almacenamiento */
function guardar(){ try { localStorage.setItem('cursos', JSON.stringify(cursos)); } catch(e){ toast('No se pudo guardar en el navegador', 'error'); } }
function cargar(){ try { cursos = JSON.parse(localStorage.getItem('cursos')) || []; } catch(e){ cursos = []; } }

function toast(msg, tipo = ''){
  const t = document.createElement('div');
  t.className = 'toast ' + tipo; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

/* Reloj HUD */
function tick(){
  const n = new Date();
  $('reloj').textContent = n.toLocaleTimeString('es-CO', {hour12:false});
  $('fechaHoy').textContent = n.toLocaleDateString('es-CO', {weekday:'long', day:'2-digit', month:'long', year:'numeric'});
}
tick(); setInterval(tick, 1000);

cargar(); render();
</script>
